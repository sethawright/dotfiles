set -g pane-active-border-style fg=#161b22,bg=default
set -g pane-border-style fg=#161b22,bg=default

# Menus (display-menu) -- see light.conf for why. Github Dark Dimmed, to match
# the ghostty theme. The menu sits a shade above the canvas (#22272e) so the
# popup reads as an overlay rather than blending into the pane behind it.
set -g menu-style "fg=#adbac7,bg=#2d333b"
set -g menu-selected-style "fg=#cdd9e5,bg=#1c3159,bold"
set -g menu-border-style "fg=#6284b2,bg=#2d333b"
