set -g pane-active-border-style "fg=#d0d7de,bg=default"
set -g pane-border-style "fg=#d0d7de,bg=default"

# Menus (display-menu). Left at tmux defaults these are near unreadable: the
# selected row is bg=yellow,fg=black and the body/border are "default", so the
# popup barely separates from the pane behind it. Github Light Default, to
# match the ghostty theme.
set -g menu-style "fg=#1f2328,bg=#f6f8fa"
set -g menu-selected-style "fg=#1f2328,bg=#ddf4ff,bold"
set -g menu-border-style "fg=#7b96b0,bg=#f6f8fa"
