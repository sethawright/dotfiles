# Global tool versions. Project configs override these.
#
# Rebuilding ruby 3.1.x on this mac needs:
#   RUBY_CFLAGS="-Wno-default-const-init-field-unsafe" mise install --force ruby@3.1.7
# Without it the socket extension is silently skipped and anything using
# net-ssh dies with "cannot load such file -- socket". Cause: current clang
# warns on ruby 3.1's own rstring.h, which fails a -Werror probe in the socket
# extconf, so ruby tries to patch Apple's netinet6/in6.h by reading
# /usr/include, a directory modern macOS does not have. Fixed in ruby 3.2+.

[settings]
# Most projects here pin only .ruby-version or .nvmrc, so read those too.
idiomatic_version_file_enable_tools = ["ruby", "node"]

# Build ruby instead of downloading mise's prebuilt binaries. The prebuilt ones
# bundle their own openssl and look for its provider modules under the CI
# machine's build path, which does not exist here, so
# OpenSSL::Provider.load("legacy") blows up. ctm needs that provider for the
# blowfish (bf-cbc) ids in IDStr.id. Building links homebrew's openssl, whose
# legacy.dylib is really on disk. Costs a few minutes per ruby install.
ruby.compile = true

[tools]
ruby = "3.4.9"
node = "24.16.0"
